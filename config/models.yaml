# LiteLLM model ids offered to the runner and the dashboard.
# `python -m glasswall.models --check` runs one real tool-calling task per model;
# only models that pass are used for evals and shown in the UI.
# Availability on free tiers changes often, so re-check before a demo.
models:
  - id: groq/openai/gpt-oss-20b
    label: gpt-oss 20B (Groq)
  - id: groq/openai/gpt-oss-120b
    label: gpt-oss 120B (Groq)
  # groq/qwen/qwen3.8-27b excluded: Groq free tier caps it at 1,000 output tokens/min (OTPM),
  # below LiteLLM's default 2,048-token request, so every call is refused (checked Oct 23).
  - id: ollama_chat/qwen3:8b
    label: Qwen3 8B (local, Ollama)
    local: true        # runs on the developer's GPU; never offered by the deployed backend
  - id: gemini/gemini-3.5-flash-lite
    label: Gemini 3.5 Flash-Lite
  - id: gemini/gemini-3.8-flash
    label: Gemini 3.8 Flash
