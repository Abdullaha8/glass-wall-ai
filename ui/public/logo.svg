<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#16181a" stroke-width="1.5" stroke-linecap="round">
  <!-- compass grid with N/E/S/W ticks -->
  <rect x="3" y="3" width="18" height="18" rx="2"/>
  <path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>
  <!-- glass pane: two parallel lines with hash strokes -->
  <path d="M10.5 7v10M13.5 7v10" stroke-width="1.6"/>
  <path d="M10.5 9.5l3-1.5M10.5 12.5l3-1.5M10.5 15.5l3-1.5" stroke-width="1"/>
  <!-- agent (left) and data (right) never touch -->
  <circle cx="7" cy="12" r="1.3" fill="#2259c9" stroke="none"/>
  <circle cx="17" cy="12" r="1.3" fill="#1e7f4f" stroke="none"/>
</svg>
